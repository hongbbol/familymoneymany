name: ✏️ 오늘의 공부 기록
description: 오늘 공부한 내용을 적고 제출하면 자동으로 데이터(data/logs.json)에 저장됩니다.
title: "[공부기록] "
labels: ["study-log"]
body:
  - type: markdown
    attributes:
      value: |
        오늘도 수고했어요! 한 줄이라도 좋으니 가볍게 기록해보세요. 🌱
        제출하면 자동으로 저장되고, 이 이슈는 저절로 닫힙니다.
  - type: input
    id: date
    attributes:
      label: 날짜
      description: 비워두면 오늘 날짜로 저장됩니다. (형식 YYYY-MM-DD)
      placeholder: "2026-10-17"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: 분야
      options:
        - 주식
        - 부동산
        - 공통/뉴스
        - 복습
    validations:
      required: true
  - type: dropdown
    id: minutes
    attributes:
      label: 공부 시간
      options:
        - 15분
        - 30분
        - 45분
        - 1시간
        - 1시간 이상
    validations:
      required: false
  - type: input
    id: topic
    attributes:
      label: 오늘 공부한 주제
      placeholder: "예: PER와 PBR의 차이"
    validations:
      required: true
  - type: textarea
    id: learned
    attributes:
      label: 배운 내용
      placeholder: "오늘 알게 된 것을 한두 문장으로 정리해보세요."
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: 새로 알게 된 용어
      description: 쉼표(,)로 구분해서 적어주세요.
      placeholder: "예: 시가총액, 배당수익률"
    validations:
      required: false
  - type: textarea
    id: memo
    attributes:
      label: 메모 / 소감
    validations:
      required: false
